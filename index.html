<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StockIt - רשימת קניות ומלאי</title>
<meta name="theme-color" content="#147D64">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StockIt">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          heebo: ['Heebo', 'sans-serif'],
          mono: ['Heebo', 'sans-serif'],
        },
        colors: {
          paper:     '#F4F6F6',
          paper2:    '#EDF1F0',
          surface:   '#FFFFFF',
          inkline:   '#DEE5E2',
          ink:       '#202724',
          dim:       '#66736D',
          basil:     { DEFAULT: '#147D64', light: '#EAF5F0', dark: '#69D3AC' },
          saffron:   { DEFAULT: '#936100', light: '#FFF6DE', dark: '#EBC36B' },
          tomato:    { DEFAULT: '#B84240', light: '#FBECEB', dark: '#F19791' },
          night:     '#141917',
          night2:    '#1D2521',
          night3:    '#303C35',
          paperdark: '#EDF3EF',
          dimdark:   '#A2B3A9',
        },
        keyframes: {
          sheetUp: { '0%': { transform: 'translateY(30px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
          stamp:   { '0%': { transform: 'scale(1)' }, '35%': { transform: 'scale(.94)' }, '65%': { transform: 'scale(1.035)' }, '100%': { transform: 'scale(1)' } },
        },
        animation: {
          sheetUp: 'sheetUp .22s ease',
          stamp:   'stamp .32s ease',
        },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  @layer base {
    body { @apply bg-paper text-ink dark:bg-night dark:text-paperdark font-heebo; }
  }
  @layer components {
    /* Purely state-driven classes (toggled by JS via classList, not re-rendered) —
       everything else is styled with plain Tailwind utilities in the markup. */
    .icon-btn        { @apply flex h-9 w-9 items-center justify-center rounded-full border border-inkline bg-paper2 text-base text-ink dark:border-night3 dark:bg-night3 dark:text-paperdark; }
    .tab-btn          { @apply flex flex-1 cursor-pointer flex-col items-center gap-0.5 rounded-lg py-2 text-xs font-semibold text-dim dark:text-dimdark; }
    .tab-btn.active   { @apply bg-basil-light text-basil dark:bg-night3 dark:text-basil-dark; }
    .overlay          { @apply fixed inset-0 z-50 hidden items-end justify-center bg-ink/50 dark:bg-black/60; }
    .overlay.open     { @apply flex; }
    .confirm-box      { @apply fixed inset-0 z-[60] hidden items-center justify-center bg-ink/50 p-5 dark:bg-black/60; }
    .confirm-box.open { @apply flex; }
    .toast            { @apply pointer-events-none fixed bottom-24 left-1/2 z-[80] max-w-[85%] -translate-x-1/2 rounded-full bg-ink px-4 py-2.5 text-center text-sm text-paper opacity-0 transition-opacity dark:bg-paperdark dark:text-night; }
    .toast.show       { @apply opacity-100; }
    .item-card.marked            { @apply border-basil/30 bg-basil-light dark:bg-basil/15; }
    .item-card.marked .item-name { @apply text-basil dark:text-basil-dark; }
    .mark-check                  { @apply hidden; }
    .item-card.marked .mark-check { @apply flex; }
    .low-stock            { @apply border-saffron bg-saffron-light dark:border-saffron-dark dark:bg-saffron/15; }
    .low-stock .item-name  { @apply text-saffron dark:text-saffron-dark; }
    .out-of-stock { @apply border-tomato/40 bg-tomato-light dark:bg-tomato/10; }
    .out-of-stock .item-name { @apply text-tomato dark:text-tomato-dark; }
    .sync-dot.live { @apply bg-basil dark:bg-basil-dark; }
  }
</style>
<style>
  /* Pure positional math (safe-area insets) — plainer as literal CSS than as
     Tailwind's arbitrary-value calc() syntax. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; min-height: 100vh; overflow-x: hidden; touch-action: pan-y; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  nav.tabbar { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  .fab { bottom: calc(78px + env(safe-area-inset-bottom)); }
  .sheet { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }

  :root { --canvas: #F4F6F6; --surface: #FFF; --text: #202724; --muted: #66736D; --line: #DEE5E2; --accent: #147D64; --accent-soft: #EAF5F0; --danger: #B84240; }
  .dark { --canvas: #141917; --surface: #1D2521; --text: #EDF3EF; --muted: #A2B3A9; --line: #303C35; --accent: #69D3AC; --accent-soft: #223B30; --danger: #F19791; }
  html { scroll-padding-top: 88px; }
  body { background-color: var(--canvas); background-image: linear-gradient(90deg, transparent 99.8%, #66736D09 99.8%); background-size: 64px 64px; color: var(--text); font-family: Heebo, sans-serif; }
  button, input, select { font: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: wait; opacity: .5; }
  button, input, select, [tabindex] { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  * { letter-spacing: 0 !important; }
  [hidden] { display: none !important; }
  .lucide { width: 20px; height: 20px; stroke-width: 1.8; flex-shrink: 0; }
  #app { max-width: 720px; height: 100dvh; min-height: 100dvh; }
  #app > header { flex-shrink: 0; min-height: 76px; padding: max(14px, env(safe-area-inset-top)) 24px 14px; background: var(--surface); backdrop-filter: none; }
  .brand { direction: ltr; font-size: 25px; line-height: 1; }
  .brand-symbol { display: grid; place-items: center; width: 38px; height: 38px; background: var(--accent); color: white; border-radius: 8px; }
  .dark .brand-symbol { color: #141917; }
  #app .icon-btn { min-width: 44px; min-height: 44px; border-radius: 8px; background: transparent; border-color: transparent; }
  #app .icon-btn:hover { background: var(--canvas); }
  #userChip { gap: 8px; }
  #userName { max-width: 100px; }
  #loginScreen { min-height: calc(100dvh - 76px); padding-bottom: 100px; }
  .login-logo { width: 112px; height: 112px; object-fit: contain; border-radius: 8px; }
  #mainApp { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .view-heading { flex-shrink: 0; padding: 26px 24px 18px; }
  .heading-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .view-title { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; }
  #app .sync-status { gap: 5px; padding: 0; font-size: 11px; white-space: nowrap; }
  #syncDot { width: 6px; height: 6px; margin: 0; }
  .sync-status[data-status="error"] { color: var(--danger); }
  .sync-status[data-status="error"] #syncDot { background: var(--danger); }
  .sync-status[data-status="busy"] #syncDot { background: #B88722; animation: syncPulse 1.4s ease-in-out infinite; }
  .summary-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  #shoppingProgress { width: 104px; height: 5px; border: 0; border-radius: 3px; overflow: hidden; accent-color: var(--accent); background: var(--line); }
  #shoppingProgress::-webkit-progress-bar { background: var(--line); }
  #shoppingProgress::-webkit-progress-value { background: var(--accent); border-radius: 3px; transition: width .2s; }
  #shoppingProgress::-moz-progress-bar { background: var(--accent); }
  .search-wrap { flex-shrink: 0; padding: 0 24px 4px; }
  .search-field { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }
  .search-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px #147D640C; }
  #searchInput { min-width: 0; width: 100%; padding: 12px 0; font-size: 15px; }
  #clearBtnWrap { flex-shrink: 0; padding: 8px 24px 0; }
  #openClearModalBtn { display: flex; align-items: center; gap: 7px; min-height: 44px; border: 0; background: transparent; color: var(--accent); padding: 6px 0; font-size: 13px; }
  #openClearModalBtn .lucide { width: 17px; height: 17px; }
  #mainContent { flex: none; overflow: visible; padding: 0 24px 24px; }
  #mainContent .dept-group { margin-top: 24px; }
  #mainContent .dept-header { gap: 8px; margin-bottom: 10px; }
  #mainContent .dept-title { min-width: 0; overflow-wrap: anywhere; font-size: 12px; font-weight: 600; color: var(--muted); }
  #mainContent .dept-count { font-variant-numeric: tabular-nums; font-size: 12px; }
  #mainContent .shopping-grid { gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #mainContent .item-card-wrap, #mainContent .item-card, #mainContent .delete-bg { border-radius: 8px; }
  #mainContent .item-card { box-shadow: 0 2px 4px #20272403; }
  #mainContent .item-card.compact { min-height: 56px; height: 56px; padding: 8px 12px; padding-inline-end: 48px; flex-direction: row; align-items: center; gap: 8px; }
  .item-card.compact > span { width: 3px; }
  #mainContent .item-card.compact .item-info { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
  #mainContent .item-card.compact .item-name { display: block; min-width: 0; padding: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mainContent .item-name { font-size: 15px; line-height: 1.6; font-weight: 600; overflow-wrap: anywhere; }
  #mainContent .item-sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #mainContent .compact .item-sub { flex-shrink: 0; margin: 0; padding: 0; font-size: 12px; white-space: nowrap; }
  .item-card .mark-check { display: flex; position: static; flex: 0 0 16px; width: 16px; height: 16px; border: 1.5px solid var(--line); background: transparent; color: transparent; }
  .marked .mark-check { background: var(--accent); color: var(--surface); border-color: var(--accent); }
  .mark-check .lucide { width: 12px; height: 12px; stroke-width: 2.5; }
  .edit-item { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); }
  .item-card-wrap > .edit-item { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-end: 2px; z-index: 2; }
  .edit-item:hover { background: #66736D10; color: var(--accent); }
  .edit-item .lucide { width: 16px; height: 16px; }
  #mainContent .stock-card { min-height: 56px; height: 56px; padding: 5px 8px; gap: 6px; flex-wrap: nowrap; }
  .stock-card .item-info { min-width: 0; }
  #mainContent .stock-card .item-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mainContent .stock-card .item-sub { display: flex; align-items: center; flex-wrap: nowrap; gap: 4px; font-size: 11px; white-space: nowrap; }
  .stock-card .edit-item { width: 32px; flex-basis: 32px; }
  #mainContent .stock-card .qty-controls { gap: 2px; }
  #mainContent .stock-card .qty-btn, #transferList .qty-btn { width: 36px; height: 44px; flex: 0 0 36px; }
  #mainContent .stock-card .qty-val, #transferList .qty-val { min-width: 32px; max-width: none; font-size: 14px; white-space: nowrap; }
  .stock-label { font-size: 11px; font-weight: 600; color: #936100; }
  .stock-label.out { color: var(--danger); }
  .dark .stock-label { color: #EBC36B; }
  .dark .stock-label.out { color: var(--danger); }
  #mainContent .qty-controls { gap: 4px; }
  body .qty-btn { width: 44px; height: 44px; border-radius: 8px; background: var(--surface); }
  .qty-btn .lucide { width: 16px; height: 16px; }
  body .qty-val { min-width: 36px; max-width: 76px; font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #mainContent .empty-state { min-height: 240px; justify-content: center; gap: 14px; border: none; border-radius: 0; font-size: 15px; }
  .empty-state .lucide { width: 34px; height: 34px; color: var(--accent); stroke-width: 1.3; }
  nav.tabbar { position: static; flex-shrink: 0; align-items: center; width: 100%; max-width: 720px; min-height: 76px; gap: 12px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); box-shadow: 0 -4px 20px #20272404; }
  #tabbar .tab-btn { min-width: 0; flex-direction: column; justify-content: center; gap: 3px; min-height: 52px; font-size: 12px; border-radius: 8px; }
  #tabbar .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
  #fabWrap { flex: 0 0 52px; justify-content: center; }
  #fabAddBtn { width: 52px; height: 52px; min-height: 52px; justify-content: center; border-radius: 50%; padding: 0; box-shadow: 0 4px 12px #147D6429; }
  #fabAddBtn .lucide { width: 24px; height: 24px; }
  .overlay, .confirm-box { backdrop-filter: blur(3px); }
  .overlay .sheet { max-width: 560px; max-height: 90dvh; border-radius: 8px 8px 0 0; padding: 20px 24px calc(24px + env(safe-area-inset-bottom)); box-shadow: 0 -12px 60px #20272414; }
  .sheet h2 { font-size: 20px; margin-bottom: 22px; }
  .sheet input:not([type="checkbox"]), .sheet select { min-height: 48px; background: var(--canvas); font-size: 16px; }
  .sheet label { font-size: 13px; }
  .sheet > button { min-height: 48px; }
  .confirm-box .confirm-card { border-radius: 8px; }
  #transferList .transfer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 36px; align-items: center; min-height: 56px; height: 56px; gap: 6px; padding: 5px 0; }
  #transferList .t-name { min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #transferList .t-qty { gap: 2px; }
  #transferList .t-add { width: 36px; }
  #transferList .t-add label { width: 36px; min-height: 44px; justify-content: center; cursor: pointer; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
  #toast { bottom: calc(88px + env(safe-area-inset-bottom)); border-radius: 8px; }
  #undoBar { position: fixed; bottom: calc(88px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 45; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 20px; padding: 8px 10px 8px 18px; border-radius: 8px; background: var(--text); color: var(--surface); box-shadow: 0 8px 28px #20272426; font-size: 13px; }
  #undoBar button { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; color: #90E0BD; font-weight: 600; }
  @keyframes syncPulse { 50% { opacity: .3; } }
  @media (max-width: 380px) {
    #app > header { padding-inline: 16px; }
    #userName { display: none; }
    .view-heading { padding: 16px; }
    .heading-top { gap: 8px; }
    .view-title { font-size: 24px; }
    .search-wrap, #clearBtnWrap { padding-inline: 16px; }
    #mainContent { padding-inline: 16px; }
    .overlay .sheet { padding-inline: 18px; }
  }
  @media (max-width: 600px) {
    #mainContent .shopping-grid { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  }
  @media (min-width: 760px) {
    .overlay { align-items: center; padding: 24px; }
    .overlay .sheet { border-radius: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div id="app" class="mx-auto flex min-h-screen max-w-[560px] flex-col">

  <header class="sticky top-0 z-30 flex items-center justify-between gap-2.5 border-b border-inkline bg-surface/95 px-4 py-3 backdrop-blur dark:border-night3 dark:bg-night2/95">
    <div class="brand flex items-center gap-2 font-extrabold" aria-label="StockIt">
      <span class="brand-symbol"><i data-lucide="shopping-bag" aria-hidden="true"></i></span>
      <span>Stock<span class="text-basil dark:text-basil-dark">It</span></span>
    </div>
    <div class="flex items-center gap-2">
      <div id="userChip" class="items-center gap-1.5" style="display:none;">
        <img id="userAvatar" class="h-[30px] w-[30px] rounded-full ring-2 ring-basil dark:ring-basil-dark" src="" alt="">
        <span id="userName" class="max-w-[80px] truncate text-xs text-dim dark:text-dimdark"></span>
        <button class="icon-btn" id="signOutBtn" title="יציאה" aria-label="יציאה"><i data-lucide="log-out" aria-hidden="true"></i></button>
      </div>
    </div>
  </header>

  <!-- ============ Login screen ============ -->
  <div id="loginScreen" class="flex-col items-center justify-center gap-[18px] px-6 py-10 text-center" style="display:none;">
    <img class="login-logo" src="./icon-512.png" alt="StockIt" width="112" height="112">
    <h1 class="m-0 text-xl font-extrabold">ברוכים הבאים</h1>
    <div id="gsiButtonContainer" class="mt-1"></div>
    <p id="loginError" class="m-0 text-sm font-bold text-tomato dark:text-tomato-dark" style="display:none;"></p>
  </div>

  <!-- ============ Main app ============ -->
  <div id="mainApp" class="flex-col flex-1" style="display:none;">
    <div class="view-heading">
      <div class="heading-top">
        <h1 id="viewTitle" class="view-title">רשימת קניות</h1>
        <div class="sync-status flex items-center text-dim dark:text-dimdark" data-status="busy" role="status" aria-live="polite">
          <span class="sync-dot inline-block rounded-full" id="syncDot"></span>
          <span id="syncText">טוען נתונים...</span>
        </div>
      </div>
      <div class="summary-row">
        <span id="listSummary"></span>
        <progress id="shoppingProgress" value="0" max="1" aria-label="התקדמות הקניות"></progress>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-field">
        <i data-lucide="search" aria-hidden="true"></i>
        <input type="search" id="searchInput" aria-label="חיפוש מוצר" placeholder="חיפוש מוצר..." class="flex-1 border-0 bg-transparent text-sm text-ink outline-none placeholder:text-dim dark:text-paperdark dark:placeholder:text-dimdark">
      </div>
    </div>

    <div class="flex justify-end px-2.5 pb-2 pt-1" id="clearBtnWrap" style="display:none;">
      <button id="openClearModalBtn" class="font-bold"><i data-lucide="package-check" aria-hidden="true"></i>סיום קנייה ועדכון מלאי</button>
    </div>

    <main id="mainContent" class="flex-1 overflow-y-auto px-4 pb-6 pt-1"></main>
  </div>

  <nav class="tabbar sticky bottom-0 z-30 flex border-t border-inkline bg-surface px-2.5 pt-1.5 dark:border-night3 dark:bg-night2" id="tabbar" style="display:none;">
    <button class="tab-btn active" data-tab="shopping" aria-current="page"><i data-lucide="shopping-cart" aria-hidden="true"></i>רשימת קניות</button>
    <div id="fabWrap" style="display:none;">
      <button id="fabAddBtn" class="flex items-center bg-basil text-white dark:bg-basil-dark dark:text-night" title="הוספת מוצר" aria-label="הוספת מוצר"><i data-lucide="plus" aria-hidden="true"></i></button>
    </div>
    <button class="tab-btn" data-tab="inventory"><i data-lucide="package" aria-hidden="true"></i>ניהול מלאי</button>
  </nav>
</div>

<!-- ============ Add item sheet ============ -->
<div class="overlay" id="addSheetOverlay" role="dialog" aria-modal="true" aria-labelledby="addSheetTitle" tabindex="-1">
  <div class="sheet w-full max-w-[560px] max-h-[88vh] overflow-y-auto animate-sheetUp rounded-t-[20px] bg-surface px-[18px] pt-4 dark:bg-night2">
    <div class="sheet-handle mx-auto mb-3.5 h-1 w-10 rounded-full bg-inkline dark:bg-night3"></div>
    <h2 id="addSheetTitle" class="m-0 mb-3.5 text-[17px] font-bold">הוספת מוצר לרשימת הקניות</h2>
    <div class="form-row mb-3">
      <label for="newItemName" class="mb-1.5 block text-[12.5px] font-semibold text-dim dark:text-dimdark">שם המוצר</label>
      <input type="text" id="newItemName" placeholder="לדוגמה: חלב" class="w-full rounded-lg border border-inkline bg-paper2 px-3 py-2.5 text-sm text-ink outline-none focus:border-basil dark:border-night3 dark:bg-night3 dark:text-paperdark dark:focus:border-basil-dark">
    </div>
    <div class="form-grid grid grid-cols-2 gap-2.5">
      <div class="form-row mb-3">
        <label for="newItemQty" class="mb-1.5 block text-[12.5px] font-semibold text-dim dark:text-dimdark">כמות</label>
        <input type="number" id="newItemQty" value="1" min="0" step="0.5" class="w-full rounded-lg border border-inkline bg-paper2 px-3 py-2.5 text-sm text-ink outline-none focus:border-basil dark:border-night3 dark:bg-night3 dark:text-paperdark dark:focus:border-basil-dark">
      </div>
      <div class="form-row mb-3">

function setSyncStatus(live) {
  if (live === true) { state.loaded = true; state.syncError = false; }
  if (live === false) state.syncError = true;
  const busy = state.requests > 0 || hasPendingChanges();
  const status = state.syncError ? 'error' : busy || !state.loaded ? 'busy' : 'live';
  document.querySelector('.sync-status').dataset.status = status;
  document.getElementById('syncDot').classList.toggle('live', status === 'live');
  document.getElementById('syncText').textContent = status === 'error' ? 'שגיאת סנכרון'
    : status === 'live' ? 'מסונכרן' : state.loaded ? 'מסנכרן...' : 'טוען נתונים...';
}

function hasPendingChanges() {
  return state.transferBusy || state.pendingShoppingIds.size > 0 || state.pendingInventoryIds.size > 0

/* =========================================================================
   API LAYER
   ========================================================================= */
async function apiCall(action, payload) {
  const sessionToken = state.sessionToken;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  const mutation = !['getAppData', 'login', 'loginAndFetch'].includes(action);
  if (mutation) state.dataVersion++;
  state.requests++;
  setSyncStatus();
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight to Apps Script
      body: JSON.stringify({
        action,
        payload: Object.assign({}, payload || {}, (action === 'login' || action === 'loginAndFetch') ? {} : { sessionToken })
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (!json.ok) {
      const err = new Error(json.error || 'Unknown API error');
      err.code = json.error;
      throw err;
    }
    return json.data;
  } catch (err) {
    console.error('API error:', err);
    if (sessionToken === state.sessionToken) {
      setSyncStatus(false);
      if (err.code === 'unauthorized' || err.code === 'session_expired') handleSessionLoss();
    }
    throw err;
  } finally {
    clearTimeout(timeout);
    state.requests--;
    if (mutation) state.dataVersion++;
    setSyncStatus();
  }
}

let fetchInFlight = false;
async function fetchAppData() {
  if (fetchInFlight || hasPendingChanges() || !state.sessionToken) return;
  fetchInFlight = true;
  const version = state.dataVersion;
  const sessionToken = state.sessionToken;
  try {
    const data = await apiCall('getAppData');
    if (sessionToken !== state.sessionToken || version !== state.dataVersion || hasPendingChanges()) return;
    state.shopping = mergeWithPending_(state.shopping, data.shopping || [], state.pendingShoppingIds, state.pendingDeleteShoppingIds);
    state.inventory = mergeWithPending_(state.inventory, data.inventory || [], state.pendingInventoryIds, state.pendingDeleteInventoryIds);
    setSyncStatus(true);
    cacheAppDataLocally_();
    render();
  } finally {
    fetchInFlight = false;
  }
}

const itemWrites = new Map();
const fieldNames = { ItemName: 'itemName', Department: 'department', Quantity: 'quantity', Unit: 'unit', IsPurchased: 'isPurchased' };

function localFields(fields) {
  return Object.fromEntries(Object.entries(fields).map(([key, value]) => [fieldNames[key], value]));
}

function queueItemUpdate(sheetName, id, fields, delay = 0) {
  const list = sheetName === 'ShoppingList' ? state.shopping : state.inventory;
  const pending = sheetName === 'ShoppingList' ? state.pendingShoppingIds : state.pendingInventoryIds;
  const item = list.find(entry => entry.id === id);
  if (!item || id.startsWith('tmp-') || state.transferBusy || !state.sessionToken) return;
  const key = sheetName + ':' + id;
  let entry = itemWrites.get(key);
  if (!entry) {
    entry = { sheetName, id, confirmed: { ...item }, fields: {}, timer: null, running: false, sessionToken: state.sessionToken };
    itemWrites.set(key, entry);
  }
  Object.assign(entry.fields, fields);
  Object.assign(item, localFields(fields));
  pending.add(id);
  state.dataVersion++;
  clearTimeout(entry.timer);
  render();
  setSyncStatus();
  entry.timer = setTimeout(() => flushItemUpdate(key, entry), delay);
}

async function flushItemUpdate(key, entry) {
  if (entry.running || itemWrites.get(key) !== entry) return;
  entry.running = true;
  const pending = entry.sheetName === 'ShoppingList' ? state.pendingShoppingIds : state.pendingInventoryIds;
  try {
    while (Object.keys(entry.fields).length && entry.sessionToken === state.sessionToken) {
      const fields = entry.fields;
      entry.fields = {};
      try {
        await apiCall('updateItem', { sheetName: entry.sheetName, id: entry.id, fields });
        Object.assign(entry.confirmed, localFields(fields));
      } catch (error) {
        if (entry.sessionToken !== state.sessionToken) return;
        const list = entry.sheetName === 'ShoppingList' ? state.shopping : state.inventory;
        const item = list.find(current => current.id === entry.id);
        if (item) Object.assign(item, entry.confirmed, localFields(entry.fields));
        showToast('לא ניתן לאשר את השמירה. יש לבדוק את הנתונים לאחר הסנכרון.');
      }
    }
  } finally {
    if (itemWrites.get(key) === entry) {
      clearTimeout(entry.timer);
      itemWrites.delete(key);
      pending.delete(entry.id);
      state.dataVersion++;
      cacheAppDataLocally_();
      render();
      setSyncStatus();
    }
  }
}

/**
 * Persists the last known good shopping/inventory data to localStorage so
 * the NEXT page load can paint instantly from cache (possibly a few seconds
 * stale) instead of a blank screen while the first real request is still in
 * flight — Apps Script's own round-trip latency (cold starts especially)
 * is otherwise the slowest visible part of opening the app.
 */
function cacheAppDataLocally_() {
  try {
    localStorage.setItem('shopapp_data_cache', JSON.stringify({ shopping: state.shopping, inventory: state.inventory }));
  } catch (e) { /* storage full or unavailable — non-critical, skip */ }
}

/**
 * Combines the server's list with local items still being written, so a poll
 * landing mid-edit doesn't visually revert an optimistic change, resurrect an
 * item currently being deleted, or drop a brand-new item that hasn't gotten
 * its real ID back yet.
 */
function mergeWithPending_(localArr, serverArr, pendingEditIds, pendingDeleteIds) {
  const merged = serverArr
    .filter(serverItem => !pendingDeleteIds.has(serverItem.id))
    .map(serverItem => {
      if (pendingEditIds.has(serverItem.id)) {
        const local = localArr.find(i => i.id === serverItem.id);
        if (local) return local;
      }
      return serverItem;
    });
  // Keep any local item that's pending and not yet reflected on the server
  // (e.g. a brand-new add whose temp id hasn't been swapped for a real one).
  localArr.forEach(local => {
    if (pendingEditIds.has(local.id) && !pendingDeleteIds.has(local.id) && !serverArr.find(s => s.id === local.id)) {
      merged.push(local);
    }
  });
  return merged;
}

function startPolling(opts) {
  stopPolling();
  if (!opts || !opts.skipInitialFetch) {
    fetchAppData().catch(() => {});
  }
  state.pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') {
      fetchAppData().catch(() => {});
    }
  }, POLL_INTERVAL_MS);
}
function stopPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = null;
}

/* =========================================================================
   AUTH (Google Identity Services)
   ========================================================================= */
function initGoogleSignIn() {
  if (!window.google || !google.accounts) { setTimeout(initGoogleSignIn, 300); return; }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true
  });
  google.accounts.id.renderButton(
    document.getElementById('gsiButtonContainer'),
    { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'he' }
  );
  google.accounts.id.prompt();
}

function parseJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(jsonPayload);
}

function handleCredentialResponse(response) {
  // Decode locally only to show a quick "signing in..." state — this is NOT
  // the authorization check. The backend independently verifies the same
  // token against Google and the email allow-list before issuing a session.
  const decoded = parseJwt(response.credential);
  showToast('מתחבר בשם ' + (decoded.name || decoded.email) + '…');

  apiCall('loginAndFetch', { idToken: response.credential })
    .then((session) => {
      state.user = { name: session.name, email: session.email, picture: session.picture };
      state.sessionToken = session.sessionToken;
      localStorage.setItem('shopapp_session', JSON.stringify({ user: state.user, sessionToken: state.sessionToken }));
      // Comes back in the same round trip as login — no separate getAppData() wait.
      state.shopping = (session.appData && session.appData.shopping) || [];
      state.inventory = (session.appData && session.appData.inventory) || [];
      cacheAppDataLocally_();
      setSyncStatus(true);
      showApp({ skipInitialFetch: true });
    })
    .catch((err) => {
      if (err.code === 'not_authorized') {
        showLoginError('החשבון הזה לא מורשה להתחבר לאפליקציה.');
      } else {
        showLoginError('שגיאה בהתחברות, נסה שוב.');
      }
      if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    });
}

function showLoginError(msg) {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('tabbar').style.display = 'none';
  document.getElementById('fabWrap').style.display = 'none';
  document.getElementById('loginError').textContent = msg;
  document.getElementById('loginError').style.display = 'block';
}

/** Called when the backend rejects a session (expired, or access was revoked). */
function handleSessionLoss() {
  resetPendingActions();
  state.user = null;
  state.sessionToken = null;
  localStorage.removeItem('shopapp_session');
  stopPolling();
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('tabbar').style.display = 'none';
  document.getElementById('fabWrap').style.display = 'none';
  document.getElementById('userChip').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  showLoginError('החיבור פג — התחבר מחדש.');
  // Try a silent re-auth if Google still has this browser signed in.
  if (window.google && google.accounts) google.accounts.id.prompt();
}

function signOut() {
  resetPendingActions();
  state.user = null;
  state.sessionToken = null;
  state.shopping = [];
  state.inventory = [];
  localStorage.removeItem('shopapp_session');
  localStorage.removeItem('shopapp_data_cache');
  stopPolling();
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('tabbar').style.display = 'none';
  document.getElementById('fabWrap').style.display = 'none';
  document.getElementById('userChip').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showApp(opts) {
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  document.getElementById('tabbar').style.display = 'flex';
  document.getElementById('fabWrap').style.display = 'flex';
  document.getElementById('userChip').style.display = 'flex';
  document.getElementById('userAvatar').src = state.user.picture || '';
  document.getElementById('userName').textContent = state.user.name || state.user.email || '';
  render(); // paint whatever's already in state (fresh data or a local cache) before the network catches up
  startPolling(opts);
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render() {
  if (state.interactionActive) { state.renderPending = true; return; }
  state.renderPending = false;
  renderClearBtnVisibility();
  const active = document.activeElement;
  const focusKey = active && active.closest('#mainContent') ? {
    id: active.dataset.id, action: active.dataset.action, edit: active.dataset.editId
  } : null;
  const shopping = state.activeTab === 'shopping';
  const purchased = state.shopping.filter(item => item.isPurchased).length;
  const stockCounts = inventoryStockCounts(state.inventory);
  document.getElementById('viewTitle').textContent = shopping ? 'רשימת קניות' : 'ניהול מלאי';
  document.getElementById('listSummary').textContent = shopping
    ? `${purchased} מתוך ${state.shopping.length} מוצרים נקנו`
    : `${state.inventory.length} מוצרים${stockCounts.low ? ' · ' + stockCounts.low + ' במלאי נמוך' : ''}${stockCounts.out ? ' · ' + stockCounts.out + ' לא במלאי' : ''}`;
  const progress = document.getElementById('shoppingProgress');
  progress.hidden = !shopping || !state.shopping.length;
  progress.max = state.shopping.length || 1;
  progress.value = purchased;
  if (state.activeTab === 'shopping') renderShopping();
  else renderInventory();
  renderIcons();
  if (focusKey) {
    const selector = focusKey.edit ? `[data-edit-id="${CSS.escape(focusKey.edit)}"]`
      : focusKey.action ? `[data-id="${CSS.escape(focusKey.id)}"][data-action="${CSS.escape(focusKey.action)}"]`
      : focusKey.id ? `.item-card[data-id="${CSS.escape(focusKey.id)}"]` : null;
    if (selector) document.querySelector(selector)?.focus({ preventScroll: true });
  }
}

function filteredShopping() {
  const q = state.search.trim().toLowerCase();
  return state.shopping.filter(i => !q || i.itemName.toLowerCase().includes(q));
}
function filteredInventory() {
  const q = state.search.trim().toLowerCase();
  return state.inventory.filter(i => !q || i.itemName.toLowerCase().includes(q));
}

function groupByDept(items) {
  const groups = {};
  items.forEach(i => {
    const d = i.department || 'שונות';
    if (!groups[d]) groups[d] = [];
    groups[d].push(i);
  });
  Object.values(groups).forEach(group => {
    group.sort((a, b) => (a.itemName || '').localeCompare(b.itemName || '', 'he'));
  });
  return groups;
}

function renderClearBtnVisibility() {
  const anyChecked = state.shopping.some(i => i.isPurchased);
  document.getElementById('clearBtnWrap').style.display = (state.activeTab === 'shopping' && anyChecked) ? 'flex' : 'none';
}

function renderShopping() {
  const main = document.getElementById('mainContent');
  const items = filteredShopping();
  if (!items.length) {
    main.innerHTML = `<div class="empty-state flex flex-col items-center text-center text-dim dark:text-dimdark">${icon(state.search.trim() ? 'search-x' : 'shopping-basket')}<span>${state.search.trim() ? 'לא נמצאו מוצרים' : 'רשימת הקניות ריקה'}</span></div>`;
    return;
  }
  const groups = groupByDept(items);
  let html = '';
  DEPARTMENTS.forEach(dept => {
    const group = groups[dept.key];
    if (!group || !group.length) return;
    html += `<div class="dept-group mt-4">
      <div class="dept-header mb-2 flex items-center gap-2 px-0.5">
        <span class="dept-dot h-2.5 w-2.5 rounded-[3px]" style="background:${dept.color}"></span>
        <span class="dept-title text-[13px] font-bold text-dim dark:text-dimdark">${dept.key}</span>
        <span class="dept-count mono ms-auto font-mono text-[11px] text-dim dark:text-dimdark">${group.length}</span>
      </div>
      <div class="shopping-grid grid grid-cols-2 gap-2">`;
    group.forEach(item => { html += shoppingItemCard(item, dept); });
    html += '</div></div>';
  });
  main.innerHTML = html;
  attachShoppingHandlers();
}

function shoppingItemCard(item, dept) {
  const justMarked = item.id === state.justMarkedId ? 'animate-stamp' : '';
  const pending = item.id.startsWith('tmp-') || state.transferBusy;
  return `
  <div class="item-card-wrap relative overflow-hidden rounded-2xl" data-id="${escapeHtml(item.id)}">
    <div class="delete-bg absolute inset-0 flex items-center justify-center rounded-2xl bg-tomato text-xl text-white dark:bg-tomato-dark" aria-hidden="true">${icon('trash-2')}</div>
    <div class="item-card compact ${item.isPurchased ? 'marked' : ''} ${justMarked} relative flex min-h-[64px] cursor-pointer touch-pan-y flex-col justify-center gap-0.5 overflow-hidden rounded-2xl border border-inkline bg-surface py-2.5 pe-3 ps-4 shadow-sm transition-colors dark:border-night3 dark:bg-night2" data-id="${escapeHtml(item.id)}" role="checkbox" tabindex="0" aria-checked="${!!item.isPurchased}" aria-disabled="${!!pending}" aria-label="${escapeHtml(item.itemName)}">
      <span class="absolute inset-y-0 start-0 w-[5px]" style="background:${dept.color}"></span>
      <div class="mark-check absolute rounded-full" aria-hidden="true">${icon('check')}</div>
      <div class="item-info min-w-0 flex-1">
        <div class="item-name flex flex-wrap items-center gap-1 text-[13.5px] font-semibold leading-tight" title="${escapeHtml(item.itemName)}">
          ${escapeHtml(item.itemName)}
          ${item.isAutoAdded ? '<span class="badge badge-auto rounded-full bg-saffron-light px-1.5 py-0.5 text-[9.5px] font-bold text-saffron dark:bg-saffron/20 dark:text-saffron-dark">אוזל</span>' : ''}
        </div>
        <div class="item-sub mono mt-0.5 font-mono text-[11.5px] text-dim dark:text-dimdark">${escapeHtml(item.quantity)} ${escapeHtml(item.unit)}</div>
      </div>
    </div>
    <button class="edit-item" data-edit-id="${escapeHtml(item.id)}" title="עריכת מוצר" aria-label="עריכת ${escapeHtml(item.itemName)}" ${pending ? 'disabled' : ''}>${icon('pencil')}</button>
  </div>`;
}

function renderInventory() {
  const main = document.getElementById('mainContent');
  const items = filteredInventory();
  if (!items.length) {
    main.innerHTML = `<div class="empty-state flex flex-col items-center text-center text-dim dark:text-dimdark">${icon(state.search.trim() ? 'search-x' : 'package-open')}<span>${state.search.trim() ? 'לא נמצאו מוצרים' : 'אין עדיין פריטים במלאי'}</span></div>`;
    return;
  }
  const groups = groupByDept(items);
  let html = '';
  DEPARTMENTS.forEach(dept => {
    const group = groups[dept.key];
    if (!group || !group.length) return;
    html += `<div class="dept-group mt-4">
      <div class="dept-header mb-2 flex items-center gap-2 px-0.5">
        <span class="dept-dot h-2.5 w-2.5 rounded-[3px]" style="background:${dept.color}"></span>
        <span class="dept-title text-[13px] font-bold text-dim dark:text-dimdark">${dept.key}</span>
        <span class="dept-count mono ms-auto font-mono text-[11px] text-dim dark:text-dimdark">${group.length}</span>
      </div>`;
    group.forEach(item => { html += inventoryItemCard(item, dept); });
    html += '</div>';
  });
  main.innerHTML = html;
  attachInventoryHandlers();
}

function sheetNumber(value) {
  if ((typeof value !== 'number' && typeof value !== 'string') || String(value).trim() === '') return null;
  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function inventoryStockState(item) {
  const quantity = sheetNumber(item.quantity);
  const minimum = sheetNumber(item.min);
  if (quantity === null) return 'unknown';
  if (quantity <= 0) return 'out';
  if (minimum !== null && minimum >= 0 && quantity <= minimum) return 'low';
  return 'available';
}

function inventoryStockCounts(items) {
  return items.reduce((counts, item) => {
    const status = inventoryStockState(item);
    if (status === 'low' || status === 'out') counts[status]++;
    return counts;
  }, { low: 0, out: 0 });
}

function inventoryItemCard(item, dept) {
  const stock = inventoryStockState(item);
  const pending = item.id.startsWith('tmp-') || state.transferBusy;
  return `
  <div class="item-card stock-card ${stock === 'low' ? 'low-stock' : stock === 'out' ? 'out-of-stock' : ''} relative mb-2 flex items-center gap-2 overflow-hidden rounded-2xl border border-inkline bg-surface py-2.5 pe-3 ps-4 shadow-sm dark:border-night3 dark:bg-night2" data-id="${escapeHtml(item.id)}">
    <span class="absolute inset-y-0 start-0 w-[5px]" style="background:${dept.color}"></span>
    <div class="item-info min-w-0 flex-1">
      <div class="item-name text-[13.5px] font-semibold" title="${escapeHtml(item.itemName)}">${escapeHtml(item.itemName)}</div>
      <div class="item-sub text-[11.5px] text-dim dark:text-dimdark">${escapeHtml(item.unit)}${stock === 'low' || stock === 'out' ? `<span class="stock-label ${stock === 'out' ? 'out' : ''}">${stock === 'out' ? 'לא במלאי' : 'מלאי נמוך'}</span>` : ''}</div>
    </div>
    <button class="edit-item" data-edit-id="${escapeHtml(item.id)}" title="עריכת מוצר" aria-label="עריכת ${escapeHtml(item.itemName)}" ${pending ? 'disabled' : ''}>${icon('pencil')}</button>
    <div class="qty-controls flex shrink-0 items-center gap-1.5">
      <button class="qty-btn flex items-center justify-center border border-inkline dark:border-night3" data-action="dec" data-id="${escapeHtml(item.id)}" title="הפחתת כמות" aria-label="הפחתת כמות ${escapeHtml(item.itemName)}" ${pending || Number(item.quantity) === 0 ? 'disabled' : ''}>${icon('minus')}</button>
      <span class="qty-val text-center font-semibold" data-qty-for="${escapeHtml(item.id)}">${escapeHtml(item.quantity)}</span>
      <button class="qty-btn flex items-center justify-center border border-inkline dark:border-night3" data-action="inc" data-id="${escapeHtml(item.id)}" title="הוספת כמות" aria-label="הוספת כמות ${escapeHtml(item.itemName)}" ${pending ? 'disabled' : ''}>${icon('plus')}</button>
    </div>
  </div>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================================
   SHOPPING TAB INTERACTIONS
   ========================================================================= */
function attachShoppingHandlers() {
  document.querySelectorAll('.item-card-wrap').forEach(wrap => {
    attachSwipeToDelete(wrap, () => toggleItemPurchased(wrap.dataset.id));
  });
}

function toggleItemPurchased(id) {
  const item = state.shopping.find(i => i.id === id);
  if (!item || id.startsWith('tmp-') || state.transferBusy) return;
  state.justMarkedId = !item.isPurchased ? id : null;
  queueItemUpdate('ShoppingList', id, { IsPurchased: !item.isPurchased });
  state.justMarkedId = null;
}

function attachSwipeToDelete(wrap, onTap) {
  const card = wrap.querySelector('.item-card');
  let startX = 0, startY = 0, currentX = 0, dragging = false, maxDragX = 0, maxDragY = 0, activePointerId = null;
  const threshold = 90;
  const tapThreshold = 16; // forgiving enough for normal finger jitter on a real tap

  // Pointer Events unify touch/mouse/pen into a single stream. Using this
  // instead of separate touch+mouse listeners avoids two real bugs:
  // 1) Browsers fire "ghost" compatibility mouse events shortly after a
  //    real touch tap. Since marking an item re-sorts the list right away,
  //    a ghost event landing after the DOM reshuffled could hit a
  //    DIFFERENT card that slid into the tapped item's old position —
  //    toggling the wrong item.
  // 2) The old code attached fresh mousemove/mouseup listeners to `window`
  //    on every single re-render and never removed them — a growing leak
  //    that also meant multiple stale handlers could fire per interaction.
  // Pointer capture below keeps move/up events targeted at this exact card
  // even if the finger drifts, with no window-level listeners needed.
  //
  // state.interactionActive additionally guards against a background poll
  // rebuilding the whole grid (innerHTML) WHILE a finger is still down on a
  // card — that would detach the very element holding pointer capture and
  // could silently swallow the tap's pointerup. render() defers itself
  // while this flag is set, and we flush it right after the gesture ends.
  //
  // maxDragY tracks vertical movement so a page-scroll drag that starts on
  // a card is never mistaken for a tap (only X movement was checked before,
  // so a purely vertical drag looked identical to a stationary tap and
  // incorrectly marked the item). touch-action:pan-y lets the browser take
  // native vertical scrolling — when it does, it fires pointercancel rather
  // than pointerup, so cancel is treated as a plain reset, never a tap.

  card.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || card.getAttribute('aria-disabled') === 'true') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return; // ignore right/middle click
    activePointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    dragging = true;
    maxDragX = 0;
    maxDragY = 0;
    state.interactionActive = true;
    card.style.transition = 'none';
    card.setPointerCapture(activePointerId);
  });

  card.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== activePointerId) return;
    currentX = e.clientX - startX;
    maxDragX = Math.max(maxDragX, Math.abs(currentX));
    maxDragY = Math.max(maxDragY, Math.abs(e.clientY - startY));
    // RTL: swipe left reveals delete -> use negative currentX
    const clamped = Math.min(0, currentX);
    card.style.transform = `translateX(${clamped}px)`;
  });

  const resetVisual = () => {
    card.style.transition = 'transform 0.15s ease';
    card.style.transform = 'translateX(0)';
    currentX = 0;
    activePointerId = null;
  };

  card.addEventListener('pointerup', (e) => {
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    state.interactionActive = false; // safe to let render() touch the DOM again from here on
    card.style.transition = 'transform 0.15s ease';
    if (currentX < -threshold) {
      card.style.transform = `translateX(-120%)`;
      setTimeout(() => deleteShoppingItem(wrap.dataset.id), 150);
      currentX = 0;
      activePointerId = null;
    } else if (maxDragX < tapThreshold && maxDragY < tapThreshold && onTap) {
      resetVisual();
      onTap(); // toggleItemPurchased() renders on its own — that also clears renderPending
    } else {
      resetVisual();
      if (state.renderPending) render(); // no local action fired a render, but a poll landed mid-gesture — flush it now
    }
  });

  // A cancel means the browser took over the gesture (e.g. native vertical
  // scroll kicked in) — always just reset, never treat it as a tap or swipe.
  card.addEventListener('pointercancel', (e) => {
    if (!dragging || e.pointerId !== activePointerId) return;
    dragging = false;
    state.interactionActive = false;
    resetVisual();
    if (state.renderPending) render();
  });
}

let undoDeletion = null;

function deleteShoppingItem(id) {
  const item = state.shopping.find(entry => entry.id === id);
  if (!item || state.transferBusy || state.pendingShoppingIds.has(id)) {
    render();
    if (item) showToast('יש להמתין לסיום השמירה');
    return;
  }
  if (!undoDeletion) undoDeletion = { items: [], timer: null, sessionToken: state.sessionToken };
  undoDeletion.items.push({ ...item });
  clearTimeout(undoDeletion.timer);
  state.shopping = state.shopping.filter(entry => entry.id !== id);
  state.pendingDeleteShoppingIds.add(id);
  state.dataVersion++;
  const batch = undoDeletion;
  batch.timer = setTimeout(() => commitDeletion(batch), 6000);
  document.getElementById('undoMessage').textContent = batch.items.length === 1 ? 'המוצר הוסר' : `${batch.items.length} מוצרים הוסרו`;
  document.getElementById('undoBar').hidden = false;
  document.getElementById('toast').classList.remove('show');
  render();
  setSyncStatus();
}

function undoShoppingDeletion() {
  if (!undoDeletion) return;
  clearTimeout(undoDeletion.timer);
  for (const item of undoDeletion.items) {
    state.shopping.push(item);
    state.pendingDeleteShoppingIds.delete(item.id);
  }
  undoDeletion = null;
  state.dataVersion++;
  document.getElementById('undoBar').hidden = true;
  render();
  setSyncStatus();
}

async function commitDeletion(batch) {
  if (undoDeletion !== batch || batch.sessionToken !== state.sessionToken) return;
  undoDeletion = null;
  document.getElementById('undoBar').hidden = true;
  const ids = batch.items.map(item => item.id);
  try {
    await apiCall('deleteItems', { sheetName: 'ShoppingList', ids });
  } catch (error) {
    if (batch.sessionToken !== state.sessionToken) return;
    state.shopping.push(...batch.items.filter(item => !state.shopping.some(current => current.id === item.id)));
    showToast('לא ניתן לאשר את המחיקה. הפריטים הוחזרו עד לסנכרון.');
  } finally {
    if (batch.sessionToken === state.sessionToken) {
      ids.forEach(id => state.pendingDeleteShoppingIds.delete(id));
      state.dataVersion++;
      cacheAppDataLocally_();
      render();
      setSyncStatus();
    }
  }
}

/* =========================================================================
   INVENTORY TAB INTERACTIONS
   ========================================================================= */
function attachInventoryHandlers() {
  document.querySelectorAll('[data-action="inc"]').forEach(el => {
    el.addEventListener('click', () => bumpInventory(el.dataset.id, 1));
  });
  document.querySelectorAll('[data-action="dec"]').forEach(el => {
    el.addEventListener('click', () => bumpInventory(el.dataset.id, -1));
  });
}

function bumpInventory(id, delta) {
  const item = state.inventory.find(i => i.id === id);
  if (!item) return;
  queueItemUpdate('Inventory', id, { Quantity: Math.max(0, Number(item.quantity) + delta) }, 500);
}

/* =========================================================================
   ADD ITEM SHEET
   ========================================================================= */
function populateDeptSelect() {
  const sel = document.getElementById('newItemDept');
  sel.innerHTML = DEPARTMENTS.map(d => `<option value="${d.key}">${d.key}</option>`).join('');
}

function openAddSheet(target) {
  if (state.transferBusy) return;
  state.editingId = null;
  state.addTarget = target;
  document.getElementById('confirmAddBtn').textContent = 'הוספה';
  document.getElementById('addSheetTitle').textContent =
    target === 'inventory' ? 'הוספת מוצר למלאי' : 'הוספת מוצר לרשימת הקניות';
  document.getElementById('newItemName').value = '';
  document.getElementById('newItemQty').value = 1;
  document.getElementById('newItemUnit').value = 'יחידה';
  document.getElementById('newItemDept').value = 'שונות';
  openDialog('addSheetOverlay');
}
function closeAddSheet() { closeDialog('addSheetOverlay'); state.editingId = null; }

function openEditSheet(id) {
  if (state.transferBusy || id.startsWith('tmp-')) return;
  const item = state[state.activeTab].find(entry => entry.id === id);
  if (!item) return;
  state.addTarget = state.activeTab;
  state.editingId = id;
  document.getElementById('addSheetTitle').textContent = 'עריכת מוצר';
  document.getElementById('confirmAddBtn').textContent = 'שמירת שינויים';
  document.getElementById('newItemName').value = item.itemName;
  document.getElementById('newItemQty').value = item.quantity;
  const unit = document.getElementById('newItemUnit');
  if (!Array.from(unit.options).some(option => option.value === item.unit)) unit.add(new Option(item.unit, item.unit));
  unit.value = item.unit;
  document.getElementById('newItemDept').value = item.department;
  openDialog('addSheetOverlay');
}

document.getElementById('newItemName').addEventListener('input', (e) => {
  if (state.editingId) return;
  const guess = guessDepartment(e.target.value);
  if (guess) document.getElementById('newItemDept').value = guess;
});

document.getElementById('cancelAddBtn').addEventListener('click', closeAddSheet);
document.getElementById('addSheetOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'addSheetOverlay') closeAddSheet();
});

document.getElementById('confirmAddBtn').addEventListener('click', () => {
  const name = document.getElementById('newItemName').value.trim();
  if (!name) { showToast('נא להזין שם מוצר'); return; }
  const qty = document.getElementById('newItemQty').valueAsNumber;
  if (!Number.isFinite(qty) || qty < 0) { showToast('נא להזין כמות תקינה, אפס או יותר'); return; }
  const unit = document.getElementById('newItemUnit').value;
  const dept = document.getElementById('newItemDept').value;
  const sheetName = state.addTarget === 'shopping' ? 'ShoppingList' : 'Inventory';
  if (state.editingId) {
    const item = state[state.addTarget].find(entry => entry.id === state.editingId);
    if (!item) { showToast('המוצר כבר אינו ברשימה'); closeAddSheet(); return; }
    if (state[state.addTarget].some(entry => entry.id !== item.id && entry.itemName.trim().toLowerCase() === name.toLowerCase())) {
      showToast('מוצר בשם הזה כבר קיים ברשימה');
      return;
    }
    queueItemUpdate(sheetName, item.id, { ItemName: name, Quantity: qty, Unit: unit, Department: dept });
    closeAddSheet();
    return;
  }

  if (state.addTarget === 'shopping') {
    const dup = state.shopping.find(i => i.itemName.trim().toLowerCase() === name.toLowerCase());
    if (dup) {
      if (dup.id.startsWith('tmp-')) { showToast('המוצר עדיין נשמר'); return; }
      showDupConfirm(name, () => {
        const current = state.shopping.find(item => item.id === dup.id);
        if (current) queueItemUpdate('ShoppingList', current.id, { Quantity: Number(current.quantity) + qty });
        closeAddSheet();
      });
      return;
    }
    addShoppingItemFlow(name, qty, unit, dept);
  } else {
    const dup = state.inventory.find(i => i.itemName.trim().toLowerCase() === name.toLowerCase());
    if (dup) {
      if (dup.id.startsWith('tmp-')) { showToast('המוצר עדיין נשמר'); return; }
      showDupConfirm(name, () => {
        const current = state.inventory.find(item => item.id === dup.id);
        if (current) queueItemUpdate('Inventory', current.id, { Quantity: Number(current.quantity) + qty });
        closeAddSheet();
      });
      return;
    }
    addInventoryItemFlow(name, qty, unit, dept);
  }
  closeAddSheet();
});

function addShoppingItemFlow(name, qty, unit, dept) {
  return addItemFlow('shopping', name, qty, unit, dept);
}
function addInventoryItemFlow(name, qty, unit, dept) {
  return addItemFlow('inventory', name, qty, unit, dept);
}

async function addItemFlow(target, name, qty, unit, dept) {
  const tempId = uid();
  const sessionToken = state.sessionToken;
  const pending = target === 'shopping' ? state.pendingShoppingIds : state.pendingInventoryIds;
  state[target].push({ id: tempId, itemName: name, department: dept, quantity: qty, unit,
    ...(target === 'shopping' ? { isPurchased: false, isAutoAdded: false, createdAt: new Date().toISOString() } : { updatedAt: new Date().toISOString() }) });
  pending.add(tempId);
  render();
  try {
    const result = await apiCall(target === 'shopping' ? 'addShoppingItem' : 'addInventoryItem', { item: { itemName: name, department: dept, quantity: qty, unit } });
    if (sessionToken !== state.sessionToken) return;
    if (!result || !result.id) throw new Error('Missing item ID');
    const item = state[target].find(entry => entry.id === tempId);
    if (item) item.id = result.id;
  } catch (error) {
    if (sessionToken !== state.sessionToken) return;
    state[target] = state[target].filter(item => item.id !== tempId);
    setSyncStatus(false);
    showToast('לא ניתן לאשר את ההוספה. יש לבדוק בסנכרון לפני הוספה חוזרת.');
  } finally {
    if (sessionToken === state.sessionToken) {
      pending.delete(tempId);
      state.dataVersion++;
      cacheAppDataLocally_();
      render();
      setSyncStatus();
    }
  }
}

/* Duplicate confirm dialog */
let dupConfirmCallback = null;
function showDupConfirm(name, onConfirm) {
  document.getElementById('dupConfirmText').textContent = `המוצר "${name}" כבר קיים ברשימה. האם להוסיף לכמות הקיימת?`;
  dupConfirmCallback = onConfirm;
  openDialog('dupConfirmBox');
}
document.getElementById('dupCancelBtn').addEventListener('click', () => {
  closeDialog('dupConfirmBox');
  dupConfirmCallback = null;
});
document.getElementById('dupOkBtn').addEventListener('click', () => {
  closeDialog('dupConfirmBox');
  if (dupConfirmCallback) dupConfirmCallback();
  dupConfirmCallback = null;
});

/* =========================================================================
   CLEAR CHECKED -> TRANSFER TO INVENTORY
   ========================================================================= */
function openClearModal() {
  if (hasPendingChanges()) { showToast('יש להמתין לסיום השמירה'); return; }
  const checked = state.shopping.filter(i => i.isPurchased);
  if (!checked.length) return;
  state.pendingTransfer = checked.map(i => ({
    id: i.id, itemName: i.itemName, department: i.department, unit: i.unit,
    quantityToAdd: i.quantity, addToInventory: true
  }));
  renderTransferList();
  openDialog('clearSheetOverlay');
}
function closeClearModal() { if (!state.transferBusy) closeDialog('clearSheetOverlay'); }

function renderTransferList() {
  const wrap = document.getElementById('transferList');
  wrap.innerHTML = state.pendingTransfer.map(p => `
    <div class="transfer-row flex items-center gap-2.5 border-b border-inkline py-2.5 last:border-b-0 dark:border-night3" data-id="${p.id}">
      <div class="t-name flex-1 text-sm font-semibold" title="${escapeHtml(p.itemName)}">${escapeHtml(p.itemName)}</div>
      <div class="t-qty flex items-center gap-1.5">
        <button class="qty-btn flex h-7 w-7 items-center justify-center rounded-full border border-inkline bg-paper2 text-base font-bold text-ink dark:border-night3 dark:bg-night3 dark:text-paperdark" data-action="t-dec" data-id="${p.id}" aria-label="הפחתת כמות ${escapeHtml(p.itemName)}">${icon('minus')}</button>
        <span class="qty-val mono min-w-[34px] text-center font-mono text-sm font-bold" data-t-qty="${p.id}">${p.quantityToAdd}</span>
        <button class="qty-btn flex h-7 w-7 items-center justify-center rounded-full border border-inkline bg-paper2 text-base font-bold text-ink dark:border-night3 dark:bg-night3 dark:text-paperdark" data-action="t-inc" data-id="${p.id}" aria-label="הוספת כמות ${escapeHtml(p.itemName)}">${icon('plus')}</button>
      </div>
      <div class="t-add">
        <label class="flex items-center" title="הוספת ${escapeHtml(p.itemName)} למלאי"><input type="checkbox" class="accent-basil" data-action="t-toggle" data-id="${p.id}" ${p.addToInventory ? 'checked' : ''}><span class="sr-only">הוספת ${escapeHtml(p.itemName)} למלאי</span></label>
      </div>
    </div>`).join('');

  wrap.querySelectorAll('[data-action="t-inc"]').forEach(el => el.addEventListener('click', () => bumpTransfer(el.dataset.id, 1)));
  wrap.querySelectorAll('[data-action="t-dec"]').forEach(el => el.addEventListener('click', () => bumpTransfer(el.dataset.id, -1)));
  wrap.querySelectorAll('[data-action="t-toggle"]').forEach(el => el.addEventListener('change', () => {
    const p = state.pendingTransfer.find(x => x.id === el.dataset.id);
    if (p) p.addToInventory = el.checked;
  }));
  renderIcons();
}
function bumpTransfer(id, delta) {
  const p = state.pendingTransfer.find(x => x.id === id);
  if (!p) return;
  p.quantityToAdd = Math.max(0, p.quantityToAdd + delta);
  document.querySelector(`[data-t-qty="${id}"]`).textContent = p.quantityToAdd;
}

document.getElementById('openClearModalBtn').addEventListener('click', openClearModal);
document.getElementById('cancelTransferBtn').addEventListener('click', closeClearModal);
document.getElementById('clearSheetOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'clearSheetOverlay') closeClearModal();
});

document.getElementById('confirmTransferBtn').addEventListener('click', async () => {
  if (state.transferBusy || hasPendingChanges()) return;
  const toAdd = state.pendingTransfer.filter(p => p.addToInventory);
  const allIds = state.pendingTransfer.map(p => p.id);
  if (!allIds.length) return;
  const sessionToken = state.sessionToken;
  const button = document.getElementById('confirmTransferBtn');
  state.transferBusy = true;
  document.querySelectorAll('#clearSheetOverlay button, #clearSheetOverlay input').forEach(control => control.disabled = true);
  document.getElementById('fabAddBtn').disabled = true;
  button.textContent = 'מעדכן מלאי...';
  render();
  try {
    if (toAdd.length) await apiCall('transferToInventory', { purchasedItems: toAdd });
    if (sessionToken !== state.sessionToken) return;
    const deleteIds = allIds.filter(id => toAdd.every(item => item.id !== id));
    if (deleteIds.length) await apiCall('deleteItems', { sheetName: 'ShoppingList', ids: deleteIds });
    if (sessionToken === state.sessionToken) showToast('הקנייה הסתיימה והמלאי עודכן');
  } catch (error) {
    if (sessionToken === state.sessionToken) showToast('לא ניתן לאשר את העדכון. יש לבדוק את המלאי לאחר הסנכרון.');
  } finally {
    if (sessionToken !== state.sessionToken) return;
    state.transferBusy = false;
    document.querySelectorAll('#clearSheetOverlay button, #clearSheetOverlay input').forEach(control => control.disabled = false);
    document.getElementById('fabAddBtn').disabled = false;
    button.textContent = 'סיום ועדכון מלאי';
    closeClearModal();
    state.pendingTransfer = [];
    if (sessionToken === state.sessionToken) {
      render();
      await fetchAppData().catch(() => {});
    }
  }
});

const dialogReturnFocus = new Map();

function openDialog(id) {
  const dialog = document.getElementById(id);
  dialogReturnFocus.set(id, document.activeElement);
  dialog.classList.add('open');
  document.getElementById('app').inert = true;
  document.getElementById('undoBar').inert = true;
  document.body.style.overflow = 'hidden';
  if (id === 'dupConfirmBox') document.getElementById('addSheetOverlay').inert = true;
  (dialog.querySelector('input:not(:disabled), button:not(:disabled)') || dialog).focus({ preventScroll: true });
}

function closeDialog(id) {
  document.getElementById(id).classList.remove('open');
  if (id === 'dupConfirmBox') document.getElementById('addSheetOverlay').inert = false;
  const open = document.querySelector('.overlay.open, .confirm-box.open');
  document.getElementById('app').inert = !!open;
  document.getElementById('undoBar').inert = !!open;
  if (!open) document.body.style.overflow = '';
  const previous = dialogReturnFocus.get(id);
  dialogReturnFocus.delete(id);
  if (previous?.isConnected && !previous.closest('[inert]')) previous.focus({ preventScroll: true });
  else if (!open) document.getElementById('fabAddBtn').focus({ preventScroll: true });
}

function resetPendingActions() {
  if (undoDeletion) clearTimeout(undoDeletion.timer);
  undoDeletion = null;
  document.getElementById('undoBar').hidden = true;
  itemWrites.forEach(entry => clearTimeout(entry.timer));
  itemWrites.clear();
  state.pendingShoppingIds.clear();
  state.pendingInventoryIds.clear();
  state.pendingDeleteShoppingIds.clear();
  state.pendingDeleteInventoryIds.clear();
  state.dataVersion++;
  state.editingId = null;
  state.interactionActive = false;
  state.transferBusy = false;
  state.pendingTransfer = [];
  document.querySelectorAll('#clearSheetOverlay button, #clearSheetOverlay input').forEach(control => control.disabled = false);
  document.getElementById('fabAddBtn').disabled = false;
  document.getElementById('confirmTransferBtn').textContent = 'סיום ועדכון מלאי';
  dupConfirmCallback = null;
  document.querySelectorAll('.overlay.open, .confirm-box.open').forEach(dialog => closeDialog(dialog.id));
}

document.getElementById('undoDeleteBtn').addEventListener('click', undoShoppingDeletion);
document.getElementById('mainContent').addEventListener('click', event => {
  const button = event.target.closest('[data-edit-id]');
  if (button && !button.disabled) openEditSheet(button.dataset.editId);
});
document.getElementById('mainContent').addEventListener('keydown', event => {
  const card = event.target.closest('[role="checkbox"]');
  if (card && ['Enter', ' '].includes(event.key)) {
    event.preventDefault();
    if (!event.repeat) toggleItemPurchased(card.dataset.id);
  }
});
document.addEventListener('keydown', event => {
  const dialog = document.querySelector('.confirm-box.open') || document.querySelector('.overlay.open');
  if (!dialog) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    if (dialog.id === 'dupConfirmBox') document.getElementById('dupCancelBtn').click();
    else if (dialog.id === 'addSheetOverlay') closeAddSheet();
    else closeClearModal();
  }
  if (event.key === 'Tab') {
    const controls = Array.from(dialog.querySelectorAll('input:not(:disabled), select:not(:disabled), button:not(:disabled)')).filter(control => control.getClientRects().length);
    const first = controls[0], last = controls[controls.length - 1];
    if (!first) { event.preventDefault(); dialog.focus(); }
    else if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});
window.addEventListener('beforeunload', event => {
  if (hasPendingChanges()) { event.preventDefault(); event.returnValue = ''; }
});

/* =========================================================================
   TABS / SEARCH / THEME / SIGN-OUT WIRING
   ========================================================================= */
document.querySelectorAll('#tabbar [data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tabbar [data-tab]').forEach(b => { b.classList.remove('active'); b.removeAttribute('aria-current'); });
    btn.classList.add('active');
    btn.setAttribute('aria-current', 'page');
    state.activeTab = btn.dataset.tab;
    document.getElementById('searchInput').value = '';
    state.search = '';
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});

document.getElementById('signOutBtn').addEventListener('click', signOut);
document.getElementById('fabAddBtn').addEventListener('click', () => openAddSheet(state.activeTab));

/* =========================================================================
   PWA: SERVICE WORKER
   ========================================================================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed', err));
  });
}

/* =========================================================================
   INIT
   ========================================================================= */
function init() {
  populateDeptSelect();
  renderIcons();

  const saved = localStorage.getItem('shopapp_session');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed.user && parsed.sessionToken) {
        state.user = parsed.user;
        state.sessionToken = parsed.sessionToken;
        try {
          const cachedData = JSON.parse(localStorage.getItem('shopapp_data_cache') || 'null');
          if (cachedData) {
            state.shopping = cachedData.shopping || [];
            state.inventory = cachedData.inventory || [];
          }
        } catch (e) { /* no usable cache — showApp() still works, just starts empty */ }
        showApp(); // paints the cached data (if any) right away; startPolling() then refreshes for real
        // Confirm the session is still valid server-side; fetchAppData()
        // (called by startPolling inside showApp) will trigger
        // handleSessionLoss() automatically if it's expired or revoked.
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
      }
    } catch (e) {
      document.getElementById('loginScreen').style.display = 'flex';
    }
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
  }
  initGoogleSignIn();
}

document.addEventListener('DOMContentLoaded', init);
</script>
